# Upload the map's tile files (*.pmtiles) to the Cloudflare R2 bucket the
# site reads them from (NEXT_PUBLIC_TILES_BASE_URL). Runs when tile files
# change or this file changes, or by hand from the Actions tab ("Run
# workflow", once it is on the default branch; on other branches open the
# latest run and use "Re-run all jobs").
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   R2 token with Object Read & Write on the bucket
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare R2 overview page
# and optionally a repository variable R2_BUCKET (default historicalgeography-tiles).
name: Upload tiles to R2

on:
  workflow_dispatch:
  push:
    paths:
      - "historicalgeography/data/tiles/**.pmtiles"
      - "historicalgeography/data/overlays/**.pmtiles"
      - ".github/workflows/upload-tiles.yml"

jobs:
  upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: historicalgeography
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then re-run this job."
            exit 1
          fi
      - name: Upload changed tile files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/upload-tiles.mjs "${{ vars.R2_BUCKET || 'historicalgeography-tiles' }}"
